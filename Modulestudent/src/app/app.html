<div class="lab-shell">
  <header class="lab-header">
    <h1>{{ title }}</h1>
    <div class="header-meta">Unit 2 Workbench • Angular 22</div>
  </header>

  <nav class="experiment-nav">
    <button [class.active]="activeTab === '2.1'" (click)="selectTab('2.1')">2.1 Component Creation</button>
    <button [class.active]="activeTab === '2.2'" (click)="selectTab('2.2')">2.2 Lifecycle Hooks</button>
    <button [class.active]="activeTab === '2.3'" (click)="selectTab('2.3')">2.3 Modules</button>
  </nav>

  <main class="lab-canvas">
    <!-- Exp 2.1 -->
    <div *ngIf="activeTab === '2.1'">
      <div class="demo-box">
        <h3>Experiment 2.1: Student Card Component</h3>
        <app-student-card name="Priya Sharma" [marks]="[88, 92, 79]"></app-student-card>
      </div>
    </div>

    <!-- Exp 2.2 -->
    <div *ngIf="activeTab === '2.2'">
      <div class="demo-box">
        <h3>Experiment 2.2: Component Lifecycle Hooks</h3>
        <button (click)="showLifecycleDemo = !showLifecycleDemo" style="padding: 6px 12px; margin-bottom: 10px; cursor: pointer;">
          Toggle Component (Mount/Destroy)
        </button>
        <app-lifecycle-demo *ngIf="showLifecycleDemo" [counter]="lifecycleCounter"></app-lifecycle-demo>
      </div>
    </div>

    <!-- Exp 2.3 -->
    <div *ngIf="activeTab === '2.3'">
      <div class="demo-box">
        <h3>Experiment 2.3: Angular Modules & Feature Routing</h3>
        <app-course-list></app-course-list>
      </div>
    </div>
  </main>
</div>
