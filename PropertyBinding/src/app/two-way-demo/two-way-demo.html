<div class="demo-box">
  <h3>Experiment 3.3: Two-Way Data Binding with ngModel</h3>
  <div class="demo-content">
    <textarea [(ngModel)]="feedback" rows="3" cols="40" placeholder="Enter your feedback"></textarea>
    <p>You typed: {{ feedback }}</p>
    <p>Character count: {{ feedback.length }}</p>
    <button (click)="clearFeedback()">Clear</button>
  </div>
</div>
