<div class="demo-box">
  <h3>Experiment 3.10: Case Studies</h3>

  <div class="case-study-section">
    <h4>Case Study A: Performance-Optimized List Rendering with trackBy</h4>
    <button (click)="refreshFirstItem()">Refresh First Item</button>
    <ul class="scroll-list">
      <li *ngFor="let item of items; trackBy: trackById">{{ item.label }}</li>
    </ul>
  </div>

  <div class="case-study-section" style="margin-top: 16px;">
    <h4>Case Study B: Permission-Based Structural Directive (*appHasRole)</h4>
    <p>Current logged in user role: <code>'editor'</code></p>
    <button *appHasRole="'admin'">Delete User (Admin Only)</button>
    <button *appHasRole="'editor'">Edit Content (Editor Only)</button>
  </div>
</div>
