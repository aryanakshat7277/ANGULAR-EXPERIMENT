<div class="demo-box">
  <h3>Experiment 3.4: Built-in Directives (*ngIf, *ngFor, [ngClass], [ngStyle])</h3>
  <div class="demo-content">
    <button (click)="showDetails = !showDetails">Toggle List</button>
    <ul *ngIf="showDetails">
      <li *ngFor="let s of students; let i = index"
          [ngClass]="{ pass: s.passed, fail: !s.passed }"
          [ngStyle]="{ 'font-weight': s.passed ? 'bold' : 'normal' }">
        {{ i + 1 }}. {{ s.name }} — {{ s.passed ? 'Passed' : 'Failed' }}
      </li>
    </ul>
  </div>
</div>
