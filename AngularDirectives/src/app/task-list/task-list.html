<div class="demo-box">
  <h3>Experiment 3.9: Directive-Based Task Manager</h3>

  <div class="add-task-bar">
    <input [(ngModel)]="newTaskName" appAutofocus placeholder="New task">
    <button (click)="addTask()">Add Task</button>
  </div>

  <p *ngIf="tasks.length === 0">No tasks yet — add one above!</p>

  <ul *ngIf="tasks.length > 0">
    <li *ngFor="let t of tasks"
        appHighlight="#fff8dc"
        [appOverdue]="t.due"
        [ngClass]="{ done: t.done }"
        [ngStyle]="{ color: priorityColor(t.priority) }">
      {{ t.name }} ({{ t.priority }}) — due {{ t.due | date:'mediumDate' }}
    </li>
  </ul>
</div>
