<div class="lab-shell">
  <header class="lab-header">
    <h1>{{ title }}</h1>
    <div class="header-meta">Unit 3 Workbench • Angular 22</div>
  </header>

  <nav class="experiment-nav">
    <button [class.active]="activeTab === '3.1'" (click)="selectTab('3.1')">3.1 Property Binding</button>
    <button [class.active]="activeTab === '3.2'" (click)="selectTab('3.2')">3.2 Event Binding</button>
    <button [class.active]="activeTab === '3.3'" (click)="selectTab('3.3')">3.3 Two-Way Binding</button>
    <button [class.active]="activeTab === '3.4'" (click)="selectTab('3.4')">3.4 Built-in Directives</button>
  </nav>

  <main class="lab-canvas">
    <!-- Exp 3.1 -->
    <div *ngIf="activeTab === '3.1'">
      <app-property-binding-demo></app-property-binding-demo>
    </div>

    <!-- Exp 3.2 -->
    <div *ngIf="activeTab === '3.2'">
      <app-event-binding-demo></app-event-binding-demo>
    </div>

    <!-- Exp 3.3 -->
    <div *ngIf="activeTab === '3.3'">
      <app-two-way-demo></app-two-way-demo>
    </div>

    <!-- Exp 3.4 -->
    <div *ngIf="activeTab === '3.4'">
      <app-directives-demo></app-directives-demo>
    </div>
  </main>
</div>
