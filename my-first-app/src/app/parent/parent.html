<div style="padding: 20px; background: white; border-radius: 8px;">
  <h2>Parent Component (Experiment 4.1 - 4.4)</h2>
  <p>Parent Name Property: <strong>{{ name }}</strong></p>
  <p>Response received from Child (@Output): <strong style="color: #007acc;">{{ msg }}</strong></p>
  <p>Score received from Child (Exp 4.2): <strong style="color: #28a745;">{{ childScore }}</strong></p>
  <p>Current Course (Exp 4.3): <strong>{{ parentCourse }}</strong></p>
  
  <div style="margin: 15px 0;">
    <button (click)="callChildMethod()" style="background: #673ab7; color: white; padding: 8px 14px; border:none; border-radius:4px; cursor:pointer;">
      Invoke Child Method via @ViewChild
    </button>
  </div>

  <div style="margin-top: 20px;">
    <app-student
      [studentName]="name"
      [course]="parentCourse"
      (notify)="receive($event)"
      (score)="handleScore($event)"
      (courseChanged)="handleCourseChange($event)">
      <b #content style="color: #e91e63;">[Projected Content: Active Session]</b>
    </app-student>
  </div>
</div>
